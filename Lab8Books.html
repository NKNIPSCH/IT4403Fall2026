<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 8: Open Library Book Search</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/mustache@4.2.0/mustache.min.js"></script>
    <script>
        $(document).ready(function () {
            var books = [];
            var currentTemplate = "standardTemplate";
            function displayBooks() {
                var template = $("#" + currentTemplate).html();
                var html = Mustache.render(template, {books: books});
                $("#results").html(html);
            }
            $("#searchButton").click(function () {
                var search = $("#searchInput").val();
                if (search == "") {
                    alert("Please enter a book title.");
                    return;
                }
                $("#results").html("Searching...");
                $.getJSON("https://openlibrary.org/search.json?q=" + encodeURIComponent(search) + "&limit=20", function (data) {
                    if (data.docs.length == 0) {
                        books = [];
                        $("#results").html("No books found.");
                        return;
                    }
                    books = [];
                    $.each(data.docs, function (index, book) {
                        books.push({
                            title: book.title || "Unknown Title",
                            author: book.author_name ? book.author_name.join(", ") : "Unknown Author",
                            image: book.cover_i ? "https://covers.openlibrary.org/b/id/" + book.cover_i + "-M.jpg" : "",
                            year: book.first_publish_year || "Unknown",
                            editions: book.edition_count || 0
                        });
                    });
                    displayBooks();
                }).fail(function () {
                    $("#results").html("Error retrieving books.");
                });
            });
            $("#listButton").click(function () {
                $("#results").removeClass().addClass("list");
            });
            $("#gridButton").click(function () {
                $("#results").removeClass().addClass("grid");
            });
            $("#threeButton").click(function () {
                $("#results").removeClass().addClass("three");
            });
            $("#firstButton").click(function () {
                $("#results").removeClass().addClass("featured");
            });
            $("#standardButton").click(function () {
                currentTemplate = "standardTemplate";
                displayBooks();
            });
            $("#detailedButton").click(function () {
                currentTemplate = "detailedTemplate";
                displayBooks();
            });
        });
    </script>
</head>
<body>
<header>
    <h1>Lab 8: CSS Flexbox and Templates</h1>
    <p>Exercises 2-6: Open Library Book Search and Layouts</p>
</header>
<div class="container">
    <a href="index.html" class="menu-button">Home</a>
    <section class="section">
        <h2>Open Library Book Search</h2>
        <div id="searchArea">
            <input type="text" id="searchInput" placeholder="Enter a book title">
            <button id="searchButton">Search</button>
        </div>
        <h3>Layout Options</h3>
        <div id="layoutButtons">
            <button id="listButton">Flow List</button>
            <button id="gridButton">Grid</button>
            <button id="threeButton">Three Columns</button>
            <button id="firstButton">Featured First Book</button>
        </div>
        <h3>Template Options</h3>
        <div id="templateButtons">
            <button id="standardButton">Standard View</button>
            <button id="detailedButton">Detailed View</button>
        </div>
        <div id="results" class="grid"></div>
    </section>
</div>
<script id="standardTemplate" type="text/template">
    {{#books}}
    <div class="book-card">
        {{#image}}
        <img src="{{image}}" alt="Book Cover">
        {{/image}}
        <h3>{{title}}</h3>
        <p>{{author}}</p>
    </div>
    {{/books}}
</script>
<script id="detailedTemplate" type="text/template">
    {{#books}}
    <div class="book-card">
        <h3>{{title}}</h3>
        <p><strong>Author:</strong> {{author}}</p>
        <p><strong>First Published:</strong> {{year}}</p>
        <p><strong>Number of Editions:</strong> {{editions}}</p>
        {{#image}}
        <img src="{{image}}" alt="Book Cover">
        {{/image}}
    </div>
    {{/books}}
</script>
<footer>
    <p>IT 4403 - Advanced Web and Mobile Applications</p>
</footer>
</body>
</html>
