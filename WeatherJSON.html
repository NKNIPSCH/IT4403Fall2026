<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 5 - Weather JSON</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function () {
            $.getJSON("JSON/weather.json", function (data) {
                const temperatureF = ((data.main.temp - 273.15) * 9 / 5 + 32).toFixed(1);
                $("#location").text(data.name + ", " + data.sys.country);
                $("#temperature").text(temperatureF + " °F");
                $("#condition").text(data.weather[0].main);
                $("#description").text(data.weather[0].description);
                $("#humidity").text(data.main.humidity + "%");
                $("#pressure").text(data.main.pressure + " hPa");
                $("#windSpeed").text(data.wind.speed + " m/s");
                $("#windDirection").text(data.wind.deg + "°");
                $("#cloudCoverage").text(data.clouds.all + "%");
            });
        });
    </script>
</head>
<body>
<header>
    <h1>Exercise 5: Weather JSON</h1>
    <div>Lab 3: JSON</div>
</header>
<div class="container">
    <a href="index.html" class="menu-button">Home</a>
    <section class="section">
        <h2>Weather Information</h2>
        <p><strong>Location:</strong> <span id="location"></span></p>
        <p><strong>Temperature:</strong> <span id="temperature"></span></p>
        <p><strong>Condition:</strong> <span id="condition"></span></p>
        <p><strong>Description:</strong> <span id="description"></span></p>
        <p><strong>Humidity:</strong> <span id="humidity"></span></p>
        <p><strong>Pressure:</strong> <span id="pressure"></span></p>
        <p><strong>Wind Speed:</strong> <span id="windSpeed"></span></p>
        <p><strong>Wind Direction:</strong> <span id="windDirection"></span></p>
        <p><strong>Cloud Coverage:</strong> <span id="cloudCoverage"></span></p>
    </section>
</div>
<footer>
    <div>IT 4403 - Advanced Web and Mobile Applications</div>
</footer>
</body>
</html>
