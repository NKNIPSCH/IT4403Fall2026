<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Library Book Search Results</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
            line-height: 1.6;
        }
        header {
            background-color: #241773;
            color: white;
            padding: 25px;
            text-align: center;
            border-bottom: 5px solid #9e7c0c;
        }
        header h1 {
            margin: 0;
        }
        header p {
            margin: 5px 0 0;
        }
        .container {
            width: 90%;
            max-width: 1000px;
            margin: 25px auto;
        }
        .section {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        h2 {
            color: #241773;
            border-bottom: 2px solid #9e7c0c;
            padding-bottom: 5px;
            margin-top: 0;
        }
        a {
            color: #241773;
            font-weight: bold;
        }
        a:hover {
            color: #9e7c0c;
        }
        .menu-button {
            display: inline-block;
            background-color: #241773;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-weight: bold;
        }
        .menu-button:hover {
            background-color: #3b2a8f;
            color: white;
        }
        .book-result {
            display: flex;
            gap: 20px;
        }
        .book-cover {
            width: 130px;
            height: auto;
            align-self: flex-start;
            border: 2px solid #241773;
            border-radius: 4px;
        }
        .book-info {
            flex: 1;
        }
        .book-info p {
            margin: 8px 0;
        }
        .no-cover {
            width: 130px;
            height: 180px;
            background-color: #ddd;
            border: 2px solid #999;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .error {
            color: #b00020;
            font-weight: bold;
        }
        footer {
            background-color: #241773;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }
        @media screen and (max-width: 700px) {
            .container {
                width: 95%;
            }
            .book-result {
                display: block;
            }
            .book-cover {
                display: block;
                margin: 0 auto 20px;
            }
            .no-cover {
                margin: 0 auto 20px;
            }
        }
    </style>
</head>
<body>
<header>
    <h1>Open Library Book Search Results</h1>
    <p>Milestone 1 - Modern Web Search Results</p>
</header>
<div class="container">
    <a href="index.html" class="menu-button">Home</a>
    <div id="searchResults">
        <div class="section">
            <p>Loading book search results...</p>
        </div>
    </div>
</div>
<footer>
    <p>IT 4403 Advanced Web and Mobile Applications</p>
</footer>
<script>
$(document).ready(function(){
    $.getJSON("openlibrary-search.json",function(data){
        let html = "";
        $.each(data.docs,function(index,book){
            let title = book.title ? book.title : "Not available";
            let authors = book.author_name ? book.author_name.join(", ") : "Not available";
            let publishYear = book.first_publish_year ? book.first_publish_year : "Not available";
            let publisher = book.publisher ? book.publisher[0] : "Not available";
            let editionCount = book.edition_count ? book.edition_count : "Not available";
            let isbn = book.isbn ? book.isbn[0] : "Not available";
            let cover = "";
            if(book.cover_i){
                cover = "https://covers.openlibrary.org/b/id/" + book.cover_i + "-M.jpg";
            }
            let bookLink = "";
            if(book.key){
                bookLink = "https://openlibrary.org" + book.key;
            }
            html += '<div class="section">';
            html += '<div class="book-result">';
            if(cover != ""){
                html += '<img src="' + cover + '" alt="Cover of ' + title + '" class="book-cover">';
            }else{
                html += '<div class="no-cover">Cover Not Available</div>';
            }
            html += '<div class="book-info">';
            html += '<h2>' + title + '</h2>';
            html += '<p><strong>Author:</strong> ' + authors + '</p>';
            html += '<p><strong>First Publication Year:</strong> ' + publishYear + '</p>';
            html += '<p><strong>Publisher:</strong> ' + publisher + '</p>';
            html += '<p><strong>Edition Count:</strong> ' + editionCount + '</p>';
            html += '<p><strong>ISBN:</strong> ' + isbn + '</p>';
            if(bookLink != ""){
                html += '<p><strong>Open Library Record:</strong> <a href="' + bookLink + '" target="_blank">View Book on Open Library</a></p>';
            }else{
                html += '<p><strong>Open Library Record:</strong> Not available</p>';
            }
            html += '</div>';
            html += '</div>';
            html += '</div>';
        });
        $("#searchResults").html(html);
    }).fail(function(){
        $("#searchResults").html('<div class="section"><p class="error">The book search results could not be loaded.</p></div>');
    });
});
</script>
</body>
</html>
