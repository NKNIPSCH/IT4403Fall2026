<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 9: Horizontal Slideshow</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function () {
            var currentPage = 1;
            var totalPages = 1;
            var searchTerm = "";
            $("#searchButton").click(function () {
                searchTerm = $("#searchInput").val().trim();
                if (searchTerm == "") {
                    $("#results").html("Please enter a book title.");
                    $("#pageCounter").html("");
                    return;
                }
                currentPage = 1;
                loadBooks();
            });
            $("#nextButton").click(function () {
                if (currentPage < totalPages) {
                    currentPage++;
                    loadBooks();
                }
            });
            $("#previousButton").click(function () {
                if (currentPage > 1) {
                    currentPage--;
                    loadBooks();
                }
            });
            function loadBooks() {
                $("#results").html("Loading books...");
                $("#pageCounter").html("(" + currentPage + " / " + totalPages + ")");
                $.getJSON("https://openlibrary.org/search.json?q=" + encodeURIComponent(searchTerm) + "&page=" + currentPage + "&limit=10", function (data) {
                    var books = data.docs || [];
                    totalPages = Math.ceil(data.numFound / 10);
                    if (totalPages == 0) {
                        totalPages = 1;
                    }
                    $("#results").html("");
                    if (books.length == 0) {
                        $("#results").html("No books found.");
                        return;
                    }
                    $.each(books, function (index, book) {
                        var title = book.title || "Unknown Title";
                        var image = book.cover_i ? "https://covers.openlibrary.org/b/id/" + book.cover_i + "-M.jpg" : "";
                        var bookHtml = "<div class='book-card'>";
                        if (image != "") {
                            bookHtml += "<img src='" + image + "' alt='Book Cover'>";
                        }
                        bookHtml += "<h3>" + $("<div>").text(title).html() + "</h3>";
                        bookHtml += "</div>";
                        $("#results").append(bookHtml);
                    });
                    $("#pageCounter").html("(" + currentPage + " / " + totalPages + ")");
                }).fail(function () {
                    $("#results").html("Error retrieving books.");
                });
            }
        });
    </script>
</head>
<body>
<header>
    <h1>Lab 9: Data Interaction Enhancements</h1>
    <p>Task 2: Horizontal Slideshow and Paging</p>
</header>
<div class="container">
    <a href="index.html" class="menu-button">Home</a>
    <section class="section">
        <h2>Open Library Book Search</h2>
        <div id="searchArea">
            <input type="text" id="searchInput" placeholder="Enter a book title" value="web api">
            <button id="searchButton">Search</button>
        </div>
        <div id="slideshowControls">
            <button id="previousButton">Previous</button>
            <span id="pageCounter">(1 / 1)</span>
            <button id="nextButton">Next</button>
        </div>
        <h3>Search Results</h3>
        <div id="results" class="slideshow"></div>
    </section>
</div>
<footer>
    <p>IT 4403 - Advanced Web and Mobile Applications</p>
</footer>
</body>
</html>
