<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 9: Mustache Pagination</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/mustache@4.2.0/mustache.min.js"></script>
    <script>
        $(document).ready(function () {
            $("#searchButton").click(function () {
                var search = $("#searchInput").val().trim();
                if (search == "") {
                    $("#results").html("Please enter a book title.");
                    $("#pages").html("");
                    $("#bookDetails").html("");
                    return;
                }
                searchBooks(search, 1);
                $("#pages").html("Pages: ");
                for (var i = 1; i <= 5; i++) {
                    $("#pages").append("<a class='page' href='#'>" + i + "</a> ");
                }
            });
            $("#pages").on("click", ".page", function (event) {
                event.preventDefault();
                var page = parseInt($(this).text());
                var search = $("#searchInput").val().trim();
                searchBooks(search, page);
            });
            $("#results").on("click", ".book-card", function () {
                var title = $(this).attr("data-title");
                var author = $(this).attr("data-author");
                var year = $(this).attr("data-year");
                $("#bookDetails").html(
                    "<h3>" + title + "</h3>" +
                    "<p><strong>Author:</strong> " + author + "</p>" +
                    "<p><strong>First Published:</strong> " + year + "</p>"
                );
            });
        });
        function searchBooks(search, page) {
            $("#results").html("Searching...");
            $("#bookDetails").html("");
            $.getJSON("https://openlibrary.org/search.json?q=" + encodeURIComponent(search) + "&page=" + page, function (data) {
                var books = [];
                var docs = (data.docs || []).slice(0, 10);
                if (docs.length == 0) {
                    $("#results").html("No books found.");
                    return;
                }
                $.each(docs, function (index, book) {
                    books.push({
                        title: book.title || "Unknown Title",
                        author: book.author_name ? book.author_name[0] : "Unknown Author",
                        image: book.cover_i ? "https://covers.openlibrary.org/b/id/" + book.cover_i + "-M.jpg" : "",
                        year: book.first_publish_year || "Unknown"
                    });
                });
                var template = $("#bookTemplate").html();
                var html = Mustache.render(template, {books: books});
                $("#results").html(html);
                $("#currentPage").html("Page " + page);
            }).fail(function () {
                $("#results").html("Error retrieving books.");
            });
        }
    </script>
</head>
<body>
<header>
    <h1>Lab 9: Data Interaction Enhancements</h1>
    <p>Task 1: Mustache Template and Pagination</p>
</header>
<div class="container">
    <a href="index.html" class="menu-button">Home</a>
    <section class="section">
        <h2>Open Library Book Search</h2>
        <div id="searchArea">
            <input type="text" id="searchInput" placeholder="Enter a book title" value="mobile web">
            <button id="searchButton">Search</button>
        </div>
        <div id="pages"></div>
        <h3 id="currentPage"></h3>
        <h3>Search Results</h3>
        <div id="results" class="grid"></div>
        <h3>Selected Book</h3>
        <div id="bookDetails"></div>
    </section>
</div>
<script id="bookTemplate" type="text/template">
    {{#books}}
    <div class="book-card" data-title="{{title}}" data-author="{{author}}" data-year="{{year}}">
        {{#image}}
        <img src="{{image}}" alt="Book Cover">
        {{/image}}
        <h3>{{title}}</h3>
        <p>{{author}}</p>
    </div>
    {{/books}}
</script>
<footer>
    <p>IT 4403 - Advanced Web and Mobile Applications</p>
</footer>
</body>
</html>
