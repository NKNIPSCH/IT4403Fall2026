<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 7 - Open Library Search</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function(){
            $("#searchButton").click(function(){
                var searchTerm = $("#searchInput").val().trim();
                if(searchTerm == ""){
                    $("#results").html("Please enter a book title or keyword.");
                    return;
                }
                $("#results").html("Loading books...");
                $.ajax({
                    url:"https://openlibrary.org/search.json",
                    type:"GET",
                    dataType:"json",
                    data:{
                        q:searchTerm,
                        limit:5,
                        fields:"key,title,author_name,first_publish_year,edition_count"
                    },
                    success:function(data){
                        $("#results").html("");
                        if(data.docs.length == 0){
                            $("#results").html("No books found.");
                        }
                        else{
                            for(var i = 0; i < data.docs.length; i++){
                                var book = data.docs[i];
                                var title = book.title || "Title unavailable";
                                var author = book.author_name ? book.author_name.join(", ") : "Author unavailable";
                                var year = book.first_publish_year || "Year unavailable";
                                var editions = book.edition_count != null ? book.edition_count : "Edition count unavailable";
                                $("#results").append("<h3>" + title + "</h3>");
                                $("#results").append("<p>Author: " + author + "</p>");
                                $("#results").append("<p>First Published: " + year + "</p>");
                                $("#results").append("<p>Edition Count: " + editions + "</p><hr>");
                            }
                        }
                    },
                    error:function(){
                        $("#results").html("Error loading books. Please try again.");
                    }
                });
            });
        });
    </script>
</head>
<body>
    <header>
        <h1>Lab 7: AJAX REST & Cross-Origin Requests</h1>
        <p>Task 3: Open Library Book Search</p>
    </header>
    <div class="container">
        <a href="index.html" class="menu-button">Home</a>
        <section class="section">
            <h2>Open Library Book Search</h2>
            <p>Enter a book title or keyword to find matching books.</p>
            <input type="text" id="searchInput" placeholder="Enter book title or keyword">
            <button id="searchButton">Search Books</button>
            <div id="results"></div>
        </section>
    </div>
    <footer>
        <p>IT 4403 - Advanced Web and Mobile Applications</p>
    </footer>
</body>
</html>
